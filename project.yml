name: Yiji
options:
  bundleIdPrefix: com.blizzard1311
  developmentLanguage: zh-Hans
packages:
  YijiCore:
    path: ./YijiCore
targets:
  YijiApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: YijiApp
        excludes:
          - Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blizzard1311.yiji
        INFOPLIST_FILE: YijiApp/Resources/Info.plist
        DEVELOPMENT_TEAM: AWQP33QVBW
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "11"
        SWIFT_VERSION: 6.0
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: YijiApp/YijiApp.entitlements
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug:
          CLOUDKIT_CONTAINER_ENVIRONMENT: Development
          YIJI_CLOUD_SYNC_ENABLED: YES
        Release:
          CLOUDKIT_CONTAINER_ENVIRONMENT: Production
          CODE_SIGN_ENTITLEMENTS: YijiApp/YijiApp-Release.entitlements
          YIJI_CLOUD_SYNC_ENABLED: NO
    dependencies:
      - package: YijiCore
    scheme:
      testTargets: []
  WeatherKitProbe:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: WeatherKitProbe
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blizzard1311.weatherkitprobe
        INFOPLIST_FILE: WeatherKitProbe/Info.plist
        DEVELOPMENT_TEAM: AWQP33QVBW
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: 6.0
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: WeatherKitProbe/WeatherKitProbe.entitlements
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets: []

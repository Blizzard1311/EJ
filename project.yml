name: Yiji
options:
  bundleIdPrefix: com.blizzard1311
packages:
  YijiCore:
    path: ./YijiCore
targets:
  YijiApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: YijiApp
        excludes:
          - Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blizzard1311.yiji
        INFOPLIST_FILE: YijiApp/Resources/Info.plist
        DEVELOPMENT_TEAM: AWQP33QVBW
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: 6.0
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: YijiCore
    scheme:
      testTargets: []
